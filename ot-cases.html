<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OT Cases</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fa;--blue:#177bc5;--line:#dfe4ea;--muted:#667085;--green:#15803d;--red:#dc2626}*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;padding:18px 14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.brand{font-size:26px;font-weight:800}.sub{font-size:12px;color:var(--muted)}.tabs{display:flex;background:#fff;border:1px solid var(--line);padding:3px;border-radius:10px}.tabs button{border:0;background:transparent;padding:8px 11px;border-radius:8px;font-weight:700;color:var(--muted)}.tabs .active{background:#edf7ff;color:var(--blue)}.note{background:#fffaf0;border:1px solid #f1d58b;color:#765000;border-radius:10px;padding:9px 11px;font-size:12px;margin-bottom:14px}.hero,.case,.stat{background:#fff;border:1px solid var(--line);border-radius:14px}.hero{padding:18px;margin-bottom:14px}.hero h1{margin:0;font-size:25px}.hero p{margin:6px 0;color:var(--muted);font-size:13px}.primary,.secondary{padding:10px 13px;border-radius:9px;font-weight:700}.primary{border:0;background:var(--blue);color:#fff}.secondary{border:1px solid #b9d8ee;background:#fff;color:var(--blue)}.cases{display:grid;gap:10px}.case{padding:14px}.casehead{display:flex;justify-content:space-between;gap:10px}.title{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:4px}.status{font-size:11px;font-weight:800;border-radius:99px;padding:5px 8px;white-space:nowrap}.ongoing{background:#ecfdf3;color:var(--green)}.problem{background:#fff1f2;color:var(--red)}.done{background:#f2f4f7;color:#475467}.timeline{border-top:1px solid var(--line);margin-top:11px;padding-top:8px}.event{display:grid;grid-template-columns:48px 8px 1fr;gap:7px;font-size:12px;padding:4px 0}.event time{color:var(--muted)}.dot{width:7px;height:7px;background:var(--blue);border-radius:50%;margin-top:4px}.event small{display:block;color:var(--muted);margin-top:2px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.actions button{font-size:11px;padding:7px 9px;border:1px solid var(--line);background:#fff;border-radius:8px}.actions .eventbtn{color:var(--blue);border-color:#b9d8ee}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat{padding:11px}.stat b{font-size:22px}.stat span{display:block;color:var(--muted);font-size:11px}.empty{text-align:center;padding:28px;border:1px dashed #cbd5e1;border-radius:14px;color:var(--muted);background:#fff}.modal{display:none;position:fixed;inset:0;background:#0006;align-items:flex-end;justify-content:center;padding:12px}.modal.open{display:flex}.sheet{background:#fff;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:18px}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheet h2{margin:0;font-size:21px}.close{border:0;background:#f2f4f7;border-radius:50%;width:34px;height:34px;font-size:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:4px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd3dc;border-radius:9px;padding:9px;font:inherit}.field textarea{min-height:75px}.sheetactions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}@media(max-width:600px){.top{align-items:flex-start}.brand{font-size:22px}.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.casehead{align-items:flex-start}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><div class="brand">OT Cases</div><div class="sub">Anaesthesia OT case tracking</div></div><div class="tabs"><button id="rTab" class="active">Resident</button><button id="cTab">Consultant</button></div></header>
<div class="note">Simple prototype for testing. Use dummy patient details.</div>
<section id="resident"><div class="hero"><h1>My OT cases</h1><p>Start a case and keep a simple timeline of what happened.</p><button class="primary" id="newCase">＋ Start new case</button></div><div class="cases" id="residentCases"></div></section>
<section id="consultant" style="display:none"><div class="hero"><h1>OT dashboard</h1><p>See ongoing, problem and completed cases.</p><div class="stats"><div class="stat"><b id="total">0</b><span>Total</span></div><div class="stat"><b id="active">0</b><span>Ongoing</span></div><div class="stat"><b id="problems">0</b><span>Problems</span></div><div class="stat"><b id="completed">0</b><span>Completed</span></div></div></div><div class="cases" id="consultantCases"></div></section>
</main>
<div class="modal" id="caseModal"><div class="sheet"><div class="sheethead"><h2>Start new case</h2><button class="close" data-close="caseModal">×</button></div><form id="caseForm"><div class="form"><div class="field"><label>OT</label><select name="ot" required><option value="">Select OT</option><option>Septic & Emergency</option><option>OT A</option><option>Lap OT</option><option>SSE</option><option>SSR</option><option>OT B</option></select></div><div class="field"><label>Resident</label><input name="resident" placeholder="Dr Test" required></div><div class="field"><label>Patient reference</label><input name="patient" placeholder="P-001" required></div><div class="field"><label>Age / sex</label><input name="age" placeholder="45 M"></div><div class="field"><label>Weight</label><input name="weight" placeholder="70 kg"></div><div class="field"><label>ASA</label><select name="asa"><option>ASA I</option><option>ASA II</option><option>ASA III</option><option>ASA IV</option><option>ASA V</option></select></div><div class="field full"><label>Procedure</label><input name="procedure" placeholder="Procedure" required></div><div class="field"><label>Anaesthesia</label><select name="anaesthesia"><option>General anaesthesia</option><option>Spinal</option><option>Epidural</option><option>GA + regional</option><option>MAC / sedation</option><option>Other</option></select></div><div class="field"><label>Airway</label><select name="airway"><option>ETT</option><option>LMA</option><option>Face mask</option><option>Regional / no airway device</option><option>Other</option></select></div></div><div class="sheetactions"><button type="button" class="secondary" data-close="caseModal">Cancel</button><button class="primary">Start case</button></div></form></div></div>
<div class="modal" id="eventModal"><div class="sheet"><div class="sheethead"><h2>Add event</h2><button class="close" data-close="eventModal">×</button></div><form id="eventForm"><input type="hidden" name="id"><div class="form"><div class="field"><label>Event</label><select name="type"><option>Drug given</option><option>Airway event</option><option>Vital sign problem</option><option>Fluid / blood product</option><option>Regional / block</option><option>Procedure milestone</option><option>Problem / complication</option><option>Other</option></select></div><div class="field"><label>Time</label><input name="time" type="time" required></div><div class="field full"><label>Details</label><textarea name="detail" placeholder="What was given or what happened?" required></textarea></div></div><div class="sheetactions"><button type="button" class="secondary" data-close="eventModal">Cancel</button><button class="primary">Add event</button></div></form></div></div>
<script>
const KEY='jln_ot_cases_v1';let cases=JSON.parse(localStorage.getItem(KEY)||'[]');
const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};
const time=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
function status(c){if(c.completed)return['done','Completed'];if(c.events.some(e=>e.type==='Problem / complication'||e.type==='Vital sign problem'))return['problem','Problem'];return['ongoing','Ongoing']}
function save(){localStorage.setItem(KEY,JSON.stringify(cases));render()}
function card(c){let s=status(c);return `<article class="case"><div class="casehead"><div><div class="title">${esc(c.ot)} · ${esc(c.procedure)}</div><div class="meta">${esc(c.patient)} · ${esc(c.age)} · ${esc(c.anaesthesia)} · ${esc(c.airway)} · ${esc(c.resident)}</div></div><span class="status ${s[0]}">${s[1]}</span></div><div class="timeline">${c.events.map(e=>`<div class="event"><time>${esc(e.time)}</time><span class="dot"></span><div><b>${esc(e.type)}</b><small>${esc(e.detail)}</small></div></div>`).join('')}</div><div class="actions">${!c.completed?`<button class="eventbtn" data-event="${c.id}">＋ Add event</button><button data-done="${c.id}">Complete case</button>`:''}<button data-view="${c.id}">View details</button></div></article>`}
function render(){let active=cases.filter(c=>!c.completed);document.getElementById('residentCases').innerHTML=active.length?active.map(card).join(''):'<div class="empty">No active cases yet.</div>';document.getElementById('consultantCases').innerHTML=cases.length?cases.slice().reverse().map(card).join(''):'<div class="empty">No cases yet.</div>';document.getElementById('total').textContent=cases.length;document.getElementById('active').textContent=active.length;document.getElementById('problems').textContent=cases.filter(c=>status(c)[0]==='problem').length;document.getElementById('completed').textContent=cases.filter(c=>c.completed).length}
function open(id){document.getElementById(id).classList.add('open')}function close(id){document.getElementById(id).classList.remove('open')}
document.getElementById('newCase').onclick=()=>open('caseModal');
document.getElementById('caseForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),id=crypto.randomUUID();cases.push({id,ot:f.get('ot'),resident:f.get('resident'),patient:f.get('patient'),age:f.get('age'),weight:f.get('weight'),asa:f.get('asa'),procedure:f.get('procedure'),anaesthesia:f.get('anaesthesia'),airway:f.get('airway'),started:new Date().toISOString(),completed:false,events:[{time:time(),type:'Case started',detail:`${f.get('anaesthesia')} · ${f.get('airway')}`}]});save();e.target.reset();close('caseModal')};
document.getElementById('eventForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),c=cases.find(x=>x.id===f.get('id'));if(c)c.events.push({time:f.get('time'),type:f.get('type'),detail:f.get('detail')});save();e.target.reset();close('eventModal')};
document.addEventListener('click',e=>{let x=e.target.closest('[data-event]');if(x){document.querySelector('#eventForm [name=id]').value=x.dataset.event;document.querySelector('#eventForm [name=time]').value=time();open('eventModal')}let d=e.target.closest('[data-done]');if(d){let c=cases.find(x=>x.id===d.dataset.done);if(c){c.events.push({time:time(),type:'Case completed',detail:'Case completed'});c.completed=true;save()}}let v=e.target.closest('[data-view]');if(v){let c=cases.find(x=>x.id===v.dataset.view);if(c)alert(`OT: ${c.ot}\nProcedure: ${c.procedure}\nResident: ${c.resident}\nStarted: ${new Date(c.started).toLocaleString()}\n\n${c.events.map(e=>e.time+' — '+e.type+' — '+e.detail).join('\n')}`)}});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));
document.getElementById('rTab').onclick=()=>{document.getElementById('rTab').classList.add('active');document.getElementById('cTab').classList.remove('active');document.getElementById('resident').style.display='block';document.getElementById('consultant').style.display='none'};
document.getElementById('cTab').onclick=()=>{document.getElementById('cTab').classList.add('active');document.getElementById('rTab').classList.remove('active');document.getElementById('resident').style.display='none';document.getElementById('consultant').style.display='block'};
render();
</script>
</body>
</html>
