<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#177bc5">
<meta name="description" content="Anaesthesia resident clinical workspace for PAC and OT case tracking.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>JLN Anaesthesia Resident</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#172033;--blue:#177bc5;--line:#dfe4ea;--muted:#667085;--card:#fff;--shadow:0 12px 30px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#edf6ff 0%,#f4f7fb 28%,#eef2f6 100%)}main{max-width:760px;margin:55px auto;padding:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}h1{margin:0 0 6px;font-size:clamp(1.8rem,4vw,2.3rem)}.muted{color:var(--muted);margin-bottom:22px}.links{display:grid;gap:12px}.link-btn{text-decoration:none;padding:15px;border-radius:12px;background:#177bc5;color:#fff;font-weight:800;display:block;box-shadow:0 8px 18px rgba(23,123,197,.22)}.link-btn.secondary{background:#edf7ff;color:#177bc5}.app-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.install-btn{display:none;border:1px solid #bad3ef;background:#fff;color:#0f5ea8;padding:12px 16px;border-radius:12px;font-weight:800;cursor:pointer}.
@media (max-width:540px){main{padding:16px} .card{padding:20px}}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>JLN Anaesthesia Resident</h1>
    <div class="muted">Anaesthesia resident clinical workspace</div>
    <div class="links">
      <a class="link-btn" href="pac.html">Pre-Anaesthesia Check-up (PAC)</a>
      <a class="link-btn secondary" href="ot-cases.html">OT Cases / Intra-op Monitoring</a>
    </div>
    <div class="app-actions">
      <button id="installBtn" class="install-btn" type="button">Install app</button>
    </div>
  </div>
</main>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch((err) => console.warn('SW registration failed', err));
}
let deferredPrompt;
const installButton = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredPrompt = event;
  if (installButton) installButton.style.display = 'inline-block';
});
if (installButton) {
  installButton.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installButton.style.display = 'none';
  });
}
</script>
</body>
</html>
